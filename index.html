<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin SAKSI KPU Sarmi</title>
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#d32f2f">
    
    <style>
        /* Menghilangkan margin dan membuat iframe penuh 100% layar */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #f8f9fa; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/macros/s/AKfycbzGc1sTWAhcRkMFMRMltGrZO2f1CCU1QJXslTPbDAtu6NZeeeswUbjuV9RVk5kVsQcJ/exec?p=admin" allow="geolocation; camera; microphone"></iframe>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker Admin Terdaftar', registration.scope);
                    })
                    .catch(err => {
                        console.log('Registrasi Service Worker Gagal: ', err);
                    });
            });
        }
    </script>
</body>
</html>
